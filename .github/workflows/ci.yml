name: CI

on:
  push:
    branches: [ f25 ]
  pull_request:
    branches: [ f25 ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install UV
      run: pip install uv
    
    - name: Install dependencies
      run: uv pip install -r requirements.txt
    
    - name: Run tests
      run: uv run pytest